<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>

    <!-- Tailwind CSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-slate-100 min-h-screen">

    <!-- Navbar -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="assets/github-logo.png" class="w-8 h-8" alt="Logo">
                <span class="font-bold text-xl text-slate-800">GitHub Issues Tracker</span>
            </div>
            <div class="flex items-center gap-4">
                <input id="search-input" type="text" placeholder="Search Issue..." class="input input-bordered input-sm w-48 sm:w-64" />
                <button class="btn btn-sm bg-blue-600 text-white">+ New Issue</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- Tabs -->
        <div class="flex gap-2 bg-white p-3 rounded-xl shadow-sm mb-6">
            <button onclick="filterTab('all')" id="btn-all" class="btn btn-sm bg-blue-600 text-white">All</button>
            <button onclick="filterTab('open')" id="btn-open" class="btn btn-sm btn-ghost">Open</button>
            <button onclick="filterTab('closed')" id="btn-closed" class="btn btn-sm btn-ghost">Closed</button>
        </div>

        <!-- Counter Header -->
        <div class="bg-white p-5 rounded-xl shadow-sm mb-6 flex justify-between items-center">
            <div>
                <h2 id="issue-count" class="text-lg font-bold text-slate-800">0 Issues</h2>
                <p class="text-xs text-slate-500">Track and manage your project issues</p>
            </div>
            <div class="flex gap-4 text-xs font-semibold text-slate-600">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span> Open</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-purple-500"></span> Closed</span>
            </div>
        </div>

        <!-- Spinner -->
        <div id="loading" class="text-center py-20 hidden">
            <span class="loading loading-spinner loading-lg text-blue-600"></span>
        </div>

        <!-- Cards Grid (4 columns) -->
        <div id="card-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Dynamic Cards -->
        </div>

    </main>

    <!-- Modal -->
    <dialog id="my_modal" class="modal">
        <div class="modal-box">
            <h3 id="modal-title" class="font-bold text-lg mb-2"></h3>
            <p id="modal-desc" class="text-sm text-slate-600 mb-4"></p>
            <div class="text-xs text-slate-500 space-y-1 bg-slate-50 p-3 rounded">
                <p><strong>Author:</strong> <span id="modal-author"></span></p>
                <p><strong>Created:</strong> <span id="modal-date"></span></p>
            </div>
            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-sm">Close</button>
                </form>
            </div>
        </div>
    </dialog>

    <script src="script/home.js"></script>
</body>

</html>
